<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EditPer - Mission Life</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

    <header class="navbar">
        <div class="user-profile">
            <div class="avatar-placeholder">
    <img src="Lo.png" alt="Admin Logo" style="width: 100%; height: 100%; object-fit: cover; border-radius: 4px;">
</div>
            <div class="user-info">
                <span class="title">MISSION LIFE</span>
                <span class="rank" id="admin-display">สวัสดี Admin</span>
            </div>
        </div>
        <div class="nav-right-group">
            <nav class="nav-links">
                <a href="Dashboard.html">Dashbord</a>
                <a href="Quest.html">Quest</a>
                <a href="Personal.html" class="active">Personal</a>
                <a href="Feedback.html">Feedback</a>
            </nav>
            <a href="Personal.html" class="back-circle-btn">↩</a>
        </div>
    </header>

    <main class="profile-container">
        <div class="profile-card">
            <aside class="profile-sidebar">
                <div class="image-container">
                    <div class="user-main-photo">
    <img src="https://via.placeholder.com/180x220" id="user-img" alt="Character">
                    </div>
                    <div style="margin-top: 10px; text-align: center; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 5px;">
    </div>
                </div>
                <div class="level-box">
                    <label>Level</label>
                    <div class="level-num">49</div>
                     
                </div>
            </aside>

            <section class="profile-form">
                <div class="form-row">
                    <label>Username</label>
                    <div class="input-with-icon">
                        <input type="text" id="p-username">
                    </div>
                </div>
                <div class="form-flex-row">
                    <div class="form-row flex-1">
                        <label>Birth Date</label>
                        <div class="input-with-icon">
                            <input type="date" id="p-birth">
                        </div>
                    </div>
                    <div class="form-row flex-1">
                        <label>Age</label>
                        <div class="input-with-icon">
                            <input type="number" id="p-age">
                        </div>
                    </div>
                </div>
                <div class="form-row">
                    <label>Email Address</label>
                    <div class="input-with-icon">
                        <input type="email" id="p-email" readonly style="background-color: #e2e8f0; cursor: not-allowed;">
                    </div>
                </div>
                <div class="form-row">
    <label>Password</label>
    <div class="input-with-icon" style="position: relative;">
        <input type="password" id="p-pass">
        <i class="fa-solid fa-eye" id="toggleIcon" onclick="togglePass()" 
           style="cursor: pointer; color: var(--navy-blue); margin-left: -30px; z-index: 10;"></i>
    </div>
</div>
                <div class="action-footer">
                    <button class="footer-btn">REFRESH</button>
                    <button class="footer-btn">ENTER</button>
                </div>
            </section>
        </div>
    </main>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('id');
    let originalData = null; // ตัวแปรเก็บข้อมูลสำรองจาก Database

    // 1. ฟังก์ชันสร้าง Avatar (รองรับรูปเสีย/Path มือถือ)
    function renderAvatar(photoUrl, name) {
    const container = document.querySelector('.user-main-photo');
    if (!container) return;

    const colors = ['#1abc9c', '#2ecc71', '#3498db', '#9b59b6', '#34495e', '#16a085', '#27ae60', '#2980b9'];
    const firstChar = name ? name.charAt(0).toUpperCase() : '?';
    const randomColor = colors[Math.floor(Math.random() * colors.length)];

    // ดึง userId จาก urlParams มาเตรียมไว้ (ใช้ตัวแปร userId ที่คุณประกาศไว้ข้างบนสุดของ script)
    const displayId = userId || "No ID";

    const fallbackHTML = `
        <div id="user-img-fallback" style="width:100%; height:220px; background-color:${randomColor}; 
             display:flex; align-items:center; justify-content:center; 
             color:white; font-weight:bold; font-size:5rem; border-radius:6px;">
            ${firstChar}
        </div>`;

    // สร้าง HTML ส่วนของ ID Badge ที่จะเอาไปต่อท้ายรูป
    const idTagHTML = `
        <div style="margin-top: 10px; text-align: center; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 8px;">
            <span style="font-size: 10px; color: #3498db; display: block; font-weight: bold; letter-spacing: 1px;">USER ID</span>
            <span style="font-size: 14px; font-weight: bold; color: white; font-family: monospace;">${displayId}</span>
        </div>`;

    const isMobilePath = photoUrl && (photoUrl.startsWith('content://') || photoUrl.startsWith('file://'));

    if (photoUrl && photoUrl.trim() !== "" && !isMobilePath) {
        // เพิ่ม idTagHTML ต่อท้ายเข้าไปใน container
        container.innerHTML = `
            <img src="${photoUrl}" id="user-img" alt="Character" 
                 style="width:100%; height:220px; object-fit:cover; border-radius:6px;"
                 onerror="this.style.display='none'; document.getElementById('user-img-fallback').style.display='flex';">
            <div id="user-img-fallback" style="display:none; width:100%; height:220px; background-color:${randomColor}; 
                 align-items:center; justify-content:center; color:white; font-weight:bold; font-size:5rem; border-radius:6px;">
                ${firstChar}
            </div>
            ${idTagHTML}`;
    } else {
        // เพิ่ม idTagHTML ต่อท้าย fallback
        container.innerHTML = fallbackHTML + idTagHTML;
    }
}

    // 2. ฟังก์ชันโหลดข้อมูล (โหลดครั้งเดียวตอนเปิดหน้า)
    async function fetchUserData() {
        if (!userId) return (window.location.href = 'Personal.html');

        try {
            const response = await fetch(`http://localhost:3000/api/users`);
            const users = await response.json();
            const user = users.find(u => (u.id || u._id) === userId);

            if (user) {
                originalData = JSON.parse(JSON.stringify(user)); // เก็บ Copy ข้อมูลดิบไว้รีเซ็ต
                applyDataToForm(user); // เอาข้อมูลไปใส่ในช่องกรอก
            }
        } catch (err) {
            console.error("❌ โหลดข้อมูลพลาด:", err);
        }
    }

    // 3. ฟังก์ชันนำข้อมูลไปใส่ใน Input (แยกออกมาเพื่อให้ปุ่ม Refresh เรียกใช้ได้)
    function applyDataToForm(user) {
        if (!user) return;
        const userName = user.characterName || user.username || "Unknown";

        document.getElementById('p-username').value = user.username || "";
        document.getElementById('p-age').value = user.age || 0;
        document.getElementById('p-email').value = user.email || "";
        document.getElementById('p-pass').value = user.password || "";
        
        const birthValue = user.birthDate || user.birthdate || user.birthday;
        if (birthValue) {
            const date = new Date(birthValue);
            if (!isNaN(date)) {
                document.getElementById('p-birth').value = date.toISOString().split('T')[0];
            }
        }

        const lvlEl = document.querySelector('.level-num');
        if (lvlEl) lvlEl.innerText = user.level || 1;

        renderAvatar(user.photoUrl || user.image, userName);
    }

    // 4. ฟังก์ชันรีเซ็ต (เมื่อกดปุ่ม REFRESH จะล้างค่าในฟอร์มให้ว่างเปล่า)
    function handleReset() {
        if (confirm("คุณต้องการล้างข้อมูลในช่องกรอกทั้งหมดใช่หรือไม่?")) {
            // ล้างค่าทุกอย่างให้เป็นค่าว่าง (Prepare for new input)
            document.getElementById('p-username').value = ""; // ล้างชื่อ
            document.getElementById('p-birth').value = "";    // ล้างวันเกิด
            document.getElementById('p-age').value = "";      // ล้างอายุ
            document.getElementById('p-pass').value = "";     // ล้างรหัสผ่าน

            // ส่วน Email และ รูปภาพ เราจะไม่แตะต้อง (ตามที่คุณต้องการ)
            // เพราะ 2 ส่วนนี้เป็นข้อมูลยืนยันตัวตนที่ไม่ให้แก้ไข
            
            console.log("🧹 ล้างข้อมูลในฟอร์มเรียบร้อยแล้ว (ยกเว้น Email และรูปภาพ)");
        }
    }

    // 5. ฟังก์ชันบันทึก
    // ลบ saveUserData ของเก่าออกให้หมด แล้ววางตัวนี้แทนที่ "ตัวเดียว" เท่านั้น
async function saveUserData() {
    if (!userId) return;

    const payload = {
        // อ้างอิงจากรูป image_1d85b3.png
        username: document.getElementById('p-username').value,
        characterName: document.getElementById('p-username').value, 
        birthDate: document.getElementById('p-birth').value, // ต้อง D ตัวใหญ่
        age: Number(document.getElementById('p-age').value) || 0, // ต้องเป็น Number (สีน้ำเงินในรูป)
        email: document.getElementById('p-email').value,
        password: document.getElementById('p-pass').value
    };

    try {
        const response = await fetch(`http://localhost:3000/api/users/update/${userId}`, { 
    // เปลี่ยนจาก missions เป็น users ให้ตรงกับ Route ใหม่ข้างบน
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
});

        if (response.ok) {
            // บังคับให้หน้าเว็บโหลดข้อมูลใหม่จาก DB จริงๆ ไม่เอาค่าเก่าที่ค้าง (Cache)
            alert("🎉 บันทึกสำเร็จ!");
            window.location.href = 'Personal.html?t=' + Date.now(); 
        } else {
            alert("❌ Server ไม่ยอมให้อัปเดต");
        }
    } catch (err) {
        alert("❌ เชื่อมต่อ Server ไม่ได้");
    }
}

    function togglePass() {
        const input = document.getElementById('p-pass');
        const icon = document.getElementById('toggleIcon');
        if (input.type === "password") {
            input.type = "text";
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            input.type = "password";
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }

    // --- จุดเริ่มต้นทำงาน ---
    window.onload = fetchUserData;

    // ผูกปุ่มให้ตรงฟังก์ชัน
    document.querySelectorAll('.footer-btn')[0].onclick = handleReset; // ปุ่ม REFRESH
    document.querySelectorAll('.footer-btn')[1].onclick = saveUserData; // ปุ่ม ENTER

    window.onkeydown = (e) => { if (e.key === 'Enter') saveUserData(); };
</script>
</body>
</html>
